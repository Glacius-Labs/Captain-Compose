name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runner: ubuntu-24.04
          - os: windows-latest
            runner: windows-latest
          - os: macos-latest
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: go test -race '-coverprofile=coverage.out' ./...
      - run: go vet ./...
      - run: go build ./cmd/...
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.out
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - run: docker compose version
      - run: go test -race -tags=integration -timeout=5m ./...
        env:
          CAPTAIN_INTEGRATION: '1'
  test-arm64:
    name: test (ubuntu-24.04-arm)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/...
  integration-arm64:
    name: integration (ubuntu-24.04-arm)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - run: docker compose version
      - run: go test -race -tags=integration -timeout=5m ./...
        env:
          CAPTAIN_INTEGRATION: '1'
  pilot:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            name: disposable production pilot (dind)
          - runner: ubuntu-24.04-arm
            arch: arm64
            name: disposable production pilot (arm64 dind)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run isolated two-minute acceptance pilot
        run: |
          docker run --rm --privileged \
            --cpus 2 --memory 4g \
            --mount type=bind,source="$GITHUB_WORKSPACE",target=/workspace \
            --workdir /workspace \
            --env CAPTAIN_PILOT_DIND=1 \
            docker:29.4.1-dind \
            sh scripts/pilot/container-run.sh --duration 2m
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: disposable-pilot-report-${{ matrix.arch }}
          path: scripts/pilot/pilot-report-*.json
          if-no-files-found: warn
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Formatting and module consistency
        run: |
          test -z "$(gofmt -l cmd internal tests)"
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - run: shellcheck scripts/*.sh scripts/pilot/*.sh
      - name: Validate Ansible role syntax
        run: |
          python3 -m venv "$RUNNER_TEMP/ansible"
          "$RUNNER_TEMP/ansible/bin/python" -m pip install --disable-pip-version-check -r deploy/ansible/requirements.txt
          echo "$RUNNER_TEMP/ansible/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ansible/bin/ansible-playbook" --syntax-check deploy/ansible/site.yml
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" python3 -m py_compile scripts/archive-safety.py
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" "$RUNNER_TEMP/ansible/bin/python" tests/contracts/check_schema.py
      - run: bash scripts/test-install.sh
      - run: bash scripts/release.sh 0.0.0-test dist/0.0.0-test
      - name: Smoke test packaged binary
        run: |
          mkdir smoke
          tar -xzf dist/0.0.0-test/captain-compose_0.0.0-test_linux_amd64.tar.gz -C smoke
          smoke/captain-compose-mqtt --version
          (cd dist/0.0.0-test && sha256sum --check checksums.txt)
      - name: Verify systemd provisioning on disposable runner
        run: |
          sudo install -m 0755 smoke/captain-compose-mqtt /usr/local/bin/captain-compose-mqtt
          docker compose -p captain-compose-service-test -f docker/mosquitto/docker-compose.yml up -d
          sudo bash scripts/provision.sh --config config/mqtt/config.example.yaml --start
          sudo bash scripts/provision.sh --config config/mqtt/config.example.yaml --start
          sudo systemd-analyze verify /etc/systemd/system/captain-compose.service
          sudo systemctl is-enabled captain-compose.service
          docker compose -p captain-compose-service-test -f docker/mosquitto/docker-compose.yml exec -T mosquitto mosquitto_sub -t captain-compose/dev-node/events -q 1 -C 1 -W 20 > service-event.json &
          subscriber=$!
          sleep 2
          docker compose -p captain-compose-service-test -f docker/mosquitto/docker-compose.yml exec -T mosquitto mosquitto_pub -t captain-compose/dev-node/commands -q 1 -m '{"id":"5420f0a0-91f8-4cae-baf6-b28936e4e1b5","type":"remove","data":{"name":"service-smoke"}}'
          wait "$subscriber"
          jq -e '.success == true and .request_id == "5420f0a0-91f8-4cae-baf6-b28936e4e1b5"' service-event.json
      - name: Converge Ansible role on disposable runner
        run: |
          diagnose() {
            sudo sh -c 'cd /var/lib/captain-compose && runuser -u captain-compose -- env DOCKER_CONFIG=/etc/captain-compose/docker /usr/local/bin/captain-compose-mqtt --config /etc/captain-compose/config.yaml --check' || true
            sudo journalctl -u captain-compose.service -n 30 --no-pager || true
          }
          trap diagnose ERR
          printf '[captain_compose]\nlocalhost ansible_connection=local\n' > "$RUNNER_TEMP/ansible-inventory.ini"
          cat > "$RUNNER_TEMP/ansible-test.yml" <<EOF
          captain_compose_version: "0.0.0-test"
          captain_compose_config_source: "$GITHUB_WORKSPACE/config/mqtt/config.example.yaml"
          captain_compose_archive_source: "$GITHUB_WORKSPACE/dist/0.0.0-test/captain-compose_0.0.0-test_linux_amd64.tar.gz"
          captain_compose_checksums_source: "$GITHUB_WORKSPACE/dist/0.0.0-test/checksums.txt"
          captain_compose_verify_provenance: false
          EOF
          "$RUNNER_TEMP/ansible/bin/ansible-playbook" -i "$RUNNER_TEMP/ansible-inventory.ini" deploy/ansible/site.yml -e "@$RUNNER_TEMP/ansible-test.yml"
          "$RUNNER_TEMP/ansible/bin/ansible-playbook" -i "$RUNNER_TEMP/ansible-inventory.ini" deploy/ansible/site.yml -e "@$RUNNER_TEMP/ansible-test.yml" \
            | tee ansible-converge-second.txt
          grep -q 'changed=0' ansible-converge-second.txt
          sudo systemctl is-active --quiet captain-compose.service
          smoke/captain-compose --config config/operator.example.yaml --environment local --json doctor \
            | tee ansible-doctor.json
          jq -e '.ok == true and .state == "completed"' ansible-doctor.json
      - name: Exercise staged backup and restore safely
        run: sudo bash scripts/test-lifecycle.sh
      - name: Clean up disposable systemd and broker services
        if: always()
        run: |
          sudo systemctl stop captain-compose.service || true
          docker compose -p captain-compose-service-test -f docker/mosquitto/docker-compose.yml down --volumes || true
