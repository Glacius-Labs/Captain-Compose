name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    env:
      RELEASE_ASSET_DIR: dist/${{ github.ref_name }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require release commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Build release archives
        run: bash scripts/release.sh "${GITHUB_REF_NAME#v}" "$RELEASE_ASSET_DIR"
      - name: Attest release assets
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: ${{ env.RELEASE_ASSET_DIR }}/*
      - name: Publish draft release for final review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RELEASE_ASSET_DIR"/* --verify-tag --draft --generate-notes --title "Captain Compose $GITHUB_REF_NAME"
