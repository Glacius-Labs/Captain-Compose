services:
  web:
    image: alpine:3.22
    command:
      - sh
      - -c
      - test -f /pilot-data/marker && while :; do sleep 3600; done
    volumes:
      - pilot-data:/pilot-data
    healthcheck:
      test: ["CMD-SHELL", "test -f /pilot-data/marker"]
      interval: 1s
      timeout: 1s
      retries: 10
volumes:
  pilot-data: {}
